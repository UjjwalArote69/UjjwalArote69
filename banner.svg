<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ujjwal Arote — Full-Stack Web Developer">
  <defs>
    <!-- Cosmic background -->
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="50%" stop-color="#0f1224"/>
      <stop offset="100%" stop-color="#070912"/>
    </radialGradient>

    <!-- Shifting text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#ec4899;#fbbf24;#a855f7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ec4899;#fbbf24;#a855f7;#06b6d4" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#fbbf24;#a855f7;#06b6d4;#ec4899" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle accent gradient for underline -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dotPattern" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.7" fill="#a855f7" opacity="0.25"/>
    </pattern>

    <!-- Diagonal grid -->
    <pattern id="gridPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#a855f7" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Layers -->
  <rect width="1280" height="360" fill="url(#bgRadial)"/>
  <rect width="1280" height="360" fill="url(#gridPattern)"/>
  <rect width="1280" height="360" fill="url(#dotPattern)"/>

  <!-- Animated scanlines -->
  <g opacity="0.5">
    <line x1="0" x2="1280" stroke="#a855f7" stroke-width="1" opacity="0.4">
      <animate attributeName="y1" values="-20;380" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-20;380" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1280" stroke="#06b6d4" stroke-width="1" opacity="0.3">
      <animate attributeName="y1" values="380;-20" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="380;-20" dur="11s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1280" stroke="#ec4899" stroke-width="1" opacity="0.25">
      <animate attributeName="y1" values="-20;380" dur="13s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="y2" values="-20;380" dur="13s" repeatCount="indefinite" begin="2s"/>
    </line>
  </g>

  <!-- Floating particles -->
  <g>
    <circle r="2.5" fill="#a855f7" filter="url(#softGlow)">
      <animate attributeName="cx" values="120;220;120" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;300;60" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#06b6d4" filter="url(#softGlow)">
      <animate attributeName="cx" values="1160;1060;1160" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;80;320" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ec4899" filter="url(#softGlow)">
      <animate attributeName="cx" values="640;780;520;640" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;180;180;40" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#fbbf24" filter="url(#softGlow)">
      <animate attributeName="cx" values="320;420;320" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="280;60;280" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#a855f7" filter="url(#softGlow)">
      <animate attributeName="cx" values="960;860;960" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="290;70;290" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- Twinkling stars -->
    <circle cx="200" cy="100" r="1" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="300" r="1" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="500" cy="320" r="1" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="900" cy="80" r="1" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="300" cy="60" r="1" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- Corner brackets -->
  <g stroke="url(#textGradient)" stroke-width="2.5" fill="none">
    <path d="M 40 70 L 40 40 L 70 40">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 1210 40 L 1240 40 L 1240 70">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0.75s"/>
    </path>
    <path d="M 40 290 L 40 320 L 70 320">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </path>
    <path d="M 1210 320 L 1240 320 L 1240 290">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="2.25s"/>
    </path>
  </g>

  <!-- Tech keywords floating in background -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#475569" letter-spacing="3" opacity="0.6">
    <text x="100" y="140">
      REACT
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="1100" y="150">
      NEXT.JS
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" begin="1s"/>
    </text>
    <text x="120" y="260">
      NODE.JS
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" begin="2s"/>
    </text>
    <text x="1080" y="270">
      MONGODB
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </text>
    <text x="80" y="200">
      TYPESCRIPT
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </text>
    <text x="1090" y="210">
      POSTGRES
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" begin="2.5s"/>
    </text>
  </g>

  <!-- Main title -->
  <text x="640" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="88" font-weight="900" fill="url(#textGradient)" filter="url(#textGlow)" letter-spacing="-3">
    UJJWAL AROTE
  </text>

  <!-- Subtitle -->
  <text x="640" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="19" fill="#94a3b8" letter-spacing="8" font-weight="600">
    &lt; FULL-STACK WEB DEVELOPER /&gt;
  </text>

  <!-- Animated underline -->
  <line x1="440" y1="240" x2="840" y2="240" stroke="url(#lineGradient)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Live "available" indicator -->
  <g transform="translate(560, 275)">
    <circle cx="0" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#22c55e" stroke-width="2">
      <animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" font-family="'Courier New', monospace" font-size="13" fill="#22c55e" letter-spacing="2" font-weight="600">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Location tag -->
  <text x="640" y="306" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#64748b" letter-spacing="3">
    📍 MUMBAI · INDIA
  </text>
</svg>
